name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test (ubuntu-latest, gcc-14)
    runs-on: ubuntu-latest

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Show toolchain
        run: |
          g++-14 --version
          cmake --version

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
